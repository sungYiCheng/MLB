trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'TODO-AZURE-SERVICE-CONNECTION'
  acrName: 'acrmlbaigo'
  imageRepository: 'mlb-ai-api'
  dockerfilePath: 'backend/Dockerfile'
  buildContext: 'backend'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: Validate backend
    jobs:
      - job: DotNetBuild
        displayName: Restore and build
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: 'sdk'
              version: '9.0.x'

          - script: dotnet restore backend/MlbAi.sln
            displayName: Restore backend

          - script: dotnet build backend/MlbAi.sln --configuration Release --no-restore
            displayName: Build backend

  - stage: BuildImage
    displayName: Build API image in ACR
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: AcrBuild
        displayName: ACR cloud build
        steps:
          - task: AzureCLI@2
            displayName: Build and push image with ACR Tasks
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageRepository):$(imageTag)" \
                  --image "$(imageRepository):latest" \
                  --file "$(dockerfilePath)" \
                  "$(buildContext)"
