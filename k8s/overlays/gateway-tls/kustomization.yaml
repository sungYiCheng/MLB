apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../gateway
  - letsencrypt-cluster-issuer.yaml
  - backend-certificate.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: mlb-ai-api-gateway
    path: gateway-tls-patch.yaml
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: mlb-ai-api
    path: http-route-tls-patch.yaml
