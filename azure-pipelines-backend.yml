trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - azure-pipelines-backend.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - azure-pipelines-backend.yml

variables:
  azureServiceConnection: 'sc-mlb-ai-go-azure'
  resourceGroupName: 'rg-mlb-ai-go-dev'
  containerAppName: 'ca-mlb-ai-api'
  containerAppUrl: 'https://ca-mlb-ai-api.wonderfulpond-0bfd6efa.eastasia.azurecontainerapps.io'
  frontendDevUrl: 'https://yellow-forest-04081e300.5.azurestaticapps.net'
  acrName: 'acrmlbaigo'
  applicationInsightsName: 'appi-mlb-ai-api-dev'
  imageRepository: 'mlb-ai-api'
  dockerfilePath: 'backend/Dockerfile'
  buildContext: 'backend'
  imageCommitTag: '$(Build.SourceVersion)'
  imageBuildTag: 'build-$(Build.BuildId)'
  imageDevLatestTag: 'dev-latest'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: Validate backend
    jobs:
      - job: DotNetBuild
        displayName: Restore, build, and test
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: 'sdk'
              version: '9.0.x'

          - script: dotnet restore backend/MlbAi.sln
            displayName: Restore backend

          - script: dotnet build backend/MlbAi.sln --configuration Release --no-restore
            displayName: Build backend

          - script: dotnet test backend/MlbAi.sln --configuration Release --no-build --logger trx --results-directory "$(Agent.TempDirectory)/test-results"
            displayName: Run backend unit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "$(Agent.TempDirectory)/test-results/*.trx"
              failTaskOnFailedTests: true

  - stage: BuildImage
    displayName: Build API image in ACR
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: AcrBuild
        displayName: ACR cloud build
        steps:
          - task: AzureCLI@2
            displayName: Build and push image with ACR Tasks
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageRepository):$(imageCommitTag)" \
                  --image "$(imageRepository):$(imageBuildTag)" \
                  --image "$(imageRepository):$(imageDevLatestTag)" \
                  --file "$(dockerfilePath)" \
                  "$(buildContext)"

  - stage: DeployBackend
    displayName: Deploy API to Container Apps
    dependsOn: BuildImage
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployContainerApp
        displayName: Update backend container app
        steps:
          - task: AzureCLI@2
            displayName: Deploy image to Container Apps
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                image="$(acrName).azurecr.io/$(imageRepository):$(imageCommitTag)"
                app_insights_connection_string="$(az resource show \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(applicationInsightsName)" \
                  --resource-type "Microsoft.Insights/components" \
                  --query "properties.ConnectionString" \
                  --output tsv 2>/dev/null || true)"

                env_vars=(
                  "Cors__AllowedOrigins__0=$(frontendDevUrl)"
                  "AppVersion=$(Build.SourceVersion)"
                  "AppBuildId=$(Build.BuildId)"
                  "AppImageTag=$(imageCommitTag)"
                )

                if [ -n "${app_insights_connection_string}" ]; then
                  echo "Application Insights resource found. Telemetry connection string will be configured."
                  env_vars+=("APPLICATIONINSIGHTS_CONNECTION_STRING=${app_insights_connection_string}")
                else
                  echo "Application Insights resource not found. Skipping telemetry connection string for this deployment."
                fi

                echo "Deploying ${image} to $(containerAppName)"
                echo "Also tagged as $(imageRepository):$(imageBuildTag) and $(imageRepository):$(imageDevLatestTag)"

                az containerapp update \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(containerAppName)" \
                  --image "${image}" \
                  --set-env-vars "${env_vars[@]}"

                az containerapp revision list \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(containerAppName)" \
                  --query "[?properties.active].{revision:name,image:properties.template.containers[0].image,traffic:properties.trafficWeight}" \
                  --output table

  - stage: SmokeTest
    displayName: Smoke test deployed API
    dependsOn: DeployBackend
    condition: succeeded()
    jobs:
      - job: ProbeBackend
        displayName: Probe backend endpoints
        steps:
          - script: |
              set -euo pipefail

              echo "Checking $(containerAppUrl)/health"
              health_response="$(curl --retry 5 --retry-delay 10 --retry-all-errors --fail "$(containerAppUrl)/health")"
              echo "$health_response"
              echo "$health_response" | grep -q '"status":"healthy"'
              echo "$health_response" | grep -q '"api-process"'
              echo "$health_response" | grep -q '"mlb-stats-api-client"'
              echo "$health_response" | grep -q '"cors-allowed-origins"'
              echo "$health_response" | grep -q '"deployment"'
              echo "$health_response" | grep -q '"version"'
              echo "$health_response" | grep -q '"buildId"'
              echo "$health_response" | grep -q '"imageTag"'
              echo "$health_response" | grep -q '"application-insights"'

              echo
              echo "Checking $(containerAppUrl)/"
              curl --retry 5 --retry-delay 10 --retry-all-errors --fail "$(containerAppUrl)/"

              echo
              echo "Checking CORS allows $(frontendDevUrl)"
              cors_headers="$(curl --retry 5 --retry-delay 10 --retry-all-errors --fail -sS -D - -o /dev/null \
                --request OPTIONS \
                --header "Origin: $(frontendDevUrl)" \
                --header "Access-Control-Request-Method: GET" \
                "$(containerAppUrl)/health")"
              echo "$cors_headers"
              echo "$cors_headers" | grep -i -q "access-control-allow-origin: $(frontendDevUrl)"
            displayName: Verify backend health

  - stage: IntegrationCheck
    displayName: Optional MLB API integration check
    dependsOn: SmokeTest
    condition: succeeded()
    jobs:
      - job: ProbeMlbData
        displayName: Probe MLB data endpoint
        steps:
          - script: |
              set -euo pipefail

              echo "Checking $(containerAppUrl)/api/games/today"
              curl --retry 5 --retry-delay 10 --retry-all-errors --fail "$(containerAppUrl)/api/games/today"
            displayName: Verify MLB data endpoint responds
            continueOnError: true
